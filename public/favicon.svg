<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fondo negro uniforme -->
  <rect width="512" height="512" rx="100" fill="#000000" />

  <!-- Patitas del reloj clásico -->
  <line x1="165" y1="395" x2="125" y2="450" stroke="#ffffff" stroke-width="22" stroke-linecap="round" />
  <line x1="347" y1="395" x2="387" y2="450" stroke="#ffffff" stroke-width="22" stroke-linecap="round" />

  <!-- Asa superior central -->
  <path d="M 216 132 C 216 88 296 88 296 132" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />

  <!-- Campana izquierda -->
  <path d="M 125 188 C 96 142 144 98 186 130 Z" fill="none" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" />

  <!-- Campana derecha -->
  <path d="M 387 188 C 416 142 368 98 326 130 Z" fill="none" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" />

  <!-- Cuerpo circular del reloj -->
  <circle cx="256" cy="280" r="145" fill="#000000" stroke="#ffffff" stroke-width="22" />

  <!-- 12 Marcas radiales del reloj vintage -->
  <line x1="256" y1="152" x2="256" y2="168" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="408" x2="256" y2="392" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <line x1="128" y1="280" x2="144" y2="280" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <line x1="384" y1="280" x2="368" y2="280" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />

  <!-- Manecillas del reloj -->
  <line x1="256" y1="280" x2="195" y2="235" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
  <line x1="256" y1="280" x2="256" y2="185" stroke="#ffffff" stroke-width="13" stroke-linecap="round" />
  <circle cx="256" cy="280" r="10" fill="#ffffff" />

  <!-- "Zz" de sueño en la esquina superior derecha en ángulo diagonal -->
  <g transform="translate(370, 95) rotate(-22)">
    <!-- Letra Z grande -->
    <path d="M 0 -15 L 36 -15 L 6 30 L 38 30" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Letra z pequeña -->
    <path d="M 38 -45 L 62 -45 L 42 -15 L 64 -15" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>